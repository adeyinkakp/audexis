[package]
name = "audexis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
hotreload = ["freya/hotreload"]

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dependencies]
uuid.workspace = true
audexis_core.workspace = true
audexis_audio.workspace = true
tracing.workspace = true
freya.workspace = true
freya-winit = "=0.4.3"
freya-core = "=0.4.3"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true

souvlaki.workspace = true
rfd.workspace = true
directories = "6.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = "4.2.0"
open = "5.4.4"
base64 = "0.22.1"
sha2 = "0.10.9"
getrandom = "0.3.4"
cargo-packager-updater = "0.2.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.19.3", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSToolbar", "NSResponder", "NSButton", "NSControl", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
